<!DOCTYPE html>
<html>
<head>
    <title>Библиотечная система</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; border: 1px solid transparent; }
        .tab.active { border: 1px solid #ddd; border-bottom: 1px solid white; border-radius: 5px 5px 0 0; background: white; }
        .tab-content { display: none; padding: 20px; border: 1px solid #ddd; border-top: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; width: auto; }
        button:hover { background: #0056b3; }
        button.delete { background: #dc3545; }
        button.delete:hover { background: #c82333; }
        .item { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .status-available { color: green; }
        .status-borrowed { color: red; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Библиотечная система</h1>

    <!-- Вкладки -->
    <div class="tabs">
        <div class="tab active" onclick="showTab('books')">Книги</div>
        <div class="tab" onclick="showTab('readers')">Читатели</div>
        <div class="tab" onclick="showTab('borrow')">Выдать книгу</div>
        <div class="tab" onclick="showTab('return')">Вернуть книгу</div>
    </div>

    <!-- Вкладка Книги -->
    <div id="books" class="tab-content active">
        <h2>Управление книгами</h2>

        <div class="grid">
            <!-- Форма добавления книги -->
            <div>
                <h3>Добавить книгу</h3>
                <form id="bookForm">
                    <div class="form-group">
                        <label>Название:</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Автор:</label>
                        <input type="text" id="author" required>
                    </div>
                    <div class="form-group">
                        <label>Год издания:</label>
                        <input type="number" id="publicationYear">
                    </div>
                    <button type="submit">Добавить книгу</button>
                </form>
            </div>

            <!-- Список книг -->
            <div>
                <h3>Список книг</h3>
                <div id="booksList"></div>
            </div>
        </div>
    </div>

    <!-- Вкладка Читатели -->
    <div id="readers" class="tab-content">
        <h2>Управление читателями</h2>

        <div class="grid">
            <!-- Форма добавления читателя -->
            <div>
                <h3>Добавить читателя</h3>
                <form id="readerForm">
                    <div class="form-group">
                        <label>Имя:</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label>Фамилия:</label>
                        <input type="text" id="lastName" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-group">
                        <label>Телефон:</label>
                        <input type="text" id="phoneNumber">
                    </div>
                    <button type="submit">Добавить читателя</button>
                </form>
            </div>

            <!-- Список читателей -->
            <div>
                <h3>Список читателей</h3>
                <div id="readersList"></div>
            </div>
        </div>
    </div>

    <!-- Вкладка Выдача книги -->
    <div id="borrow" class="tab-content">
        <h2>Выдать книгу читателю</h2>

        <form id="borrowForm">
            <div class="form-group">
                <label>Выберите книгу:</label>
                <select id="borrowBookId" required>
                    <option value="">-- Выберите книгу --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Выберите читателя:</label>
                <select id="borrowReaderId" required>
                    <option value="">-- Выберите читателя --</option>
                </select>
            </div>
            <button type="submit">Выдать книгу</button>
        </form>

        <h3>Книги на руках</h3>
        <div id="borrowedBooksList"></div>
    </div>

    <!-- Вкладка Возврат книги -->
    <div id="return" class="tab-content">
        <h2>Вернуть книгу</h2>

        <form id="returnForm">
            <div class="form-group">
                <label>Выберите книгу для возврата:</label>
                <select id="returnBookId" required>
                    <option value="">-- Выберите книгу --</option>
                </select>
            </div>
            <button type="submit" class="delete">Вернуть книгу</button>
        </form>
    </div>
</div>

<script>
    let books = [];
    let readers = [];

    // Инициализация
    document.addEventListener('DOMContentLoaded', function() {
        loadBooks();
        loadReaders();
        setupForms();
    });

    // Переключение вкладок
    function showTab(tabName) {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        document.querySelector(`.tab:nth-child(${getTabIndex(tabName)})`).classList.add('active');
        document.getElementById(tabName).classList.add('active');
    }

    function getTabIndex(tabName) {
        const tabs = ['books', 'readers', 'borrow', 'return'];
        return tabs.indexOf(tabName) + 1;
    }

    // Настройка форм
    function setupForms() {
        // Форма добавления книги
        document.getElementById('bookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            addBook();
        });

        // Форма добавления читателя
        document.getElementById('readerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            addReader();
        });

        // Форма выдачи книги
        document.getElementById('borrowForm').addEventListener('submit', function(e) {
            e.preventDefault();
            borrowBook();
        });

        // Форма возврата книги
        document.getElementById('returnForm').addEventListener('submit', function(e) {
            e.preventDefault();
            returnBook();
        });
    }

    // === КНИГИ ===
    function loadBooks() {
        fetch('/api/books')
            .then(response => response.json())
            .then(data => {
                books = data;
                renderBooks();
                updateBookSelects();
            });
    }

    function addBook() {
        const book = {
            title: document.getElementById('title').value,
            author: document.getElementById('author').value,
            publicationYear: parseInt(document.getElementById('publicationYear').value),
            isBorrowed: false
        };

        fetch('/api/books', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(book)
        })
        .then(response => response.json())
        .then(() => {
            document.getElementById('bookForm').reset();
            loadBooks();
        });
    }

    function renderBooks() {
        const booksList = document.getElementById('booksList');
        booksList.innerHTML = '';

        if (books.length === 0) {
            booksList.innerHTML = '<p>Книг пока нет</p>';
            return;
        }

        books.forEach(book => {
            const bookElement = document.createElement('div');
            bookElement.className = 'item';
            bookElement.innerHTML = `
                <strong>${book.title}</strong> - ${book.author} (${book.publicationYear})
                <br><small>ID: ${book.id} |
                <span class="${book.isBorrowed ? 'status-borrowed' : 'status-available'}">
                    ${book.isBorrowed ? '📖 Выдана' : '✅ Доступна'}
                </span></small>
                <button onclick="deleteBook(${book.id})" class="delete">Удалить</button>
            `;
            booksList.appendChild(bookElement);
        });
    }

    function deleteBook(bookId) {
        if (confirm('Удалить книгу?')) {
            fetch(`/api/books/${bookId}`, { method: 'DELETE' })
                .then(() => loadBooks());
        }
    }

    // === ЧИТАТЕЛИ ===
    function loadReaders() {
        fetch('/api/readers')
            .then(response => response.json())
            .then(data => {
                readers = data;
                renderReaders();
                updateReaderSelect();
            });
    }

    function addReader() {
        const reader = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            phoneNumber: document.getElementById('phoneNumber').value
        };

        fetch('/api/readers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reader)
        })
        .then(response => response.json())
        .then(() => {
            document.getElementById('readerForm').reset();
            loadReaders();
        });
    }

    function renderReaders() {
        const readersList = document.getElementById('readersList');
        readersList.innerHTML = '';

        if (readers.length === 0) {
            readersList.innerHTML = '<p>Читателей пока нет</p>';
            return;
        }

        readers.forEach(reader => {
            const readerElement = document.createElement('div');
            readerElement.className = 'item';
            readerElement.innerHTML = `
                <strong>${reader.firstName} ${reader.lastName}</strong>
                <br>📧 ${reader.email} | 📞 ${reader.phoneNumber}
                <br><small>ID: ${reader.id}</small>
            `;
            readersList.appendChild(readerElement);
        });
    }

    // === ВЫДАЧА И ВОЗВРАТ КНИГ ===
    function updateBookSelects() {
        const borrowSelect = document.getElementById('borrowBookId');
        const returnSelect = document.getElementById('returnBookId');

        borrowSelect.innerHTML = '<option value="">-- Выберите книгу --</option>';
        returnSelect.innerHTML = '<option value="">-- Выберите книгу --</option>';

        books.forEach(book => {
            if (!book.isBorrowed) {
                borrowSelect.innerHTML += `<option value="${book.id}">${book.title} - ${book.author}</option>`;
            } else {
                returnSelect.innerHTML += `<option value="${book.id}">${book.title} - ${book.author}</option>`;
            }
        });
    }

    function updateReaderSelect() {
        const select = document.getElementById('borrowReaderId');
        select.innerHTML = '<option value="">-- Выберите читателя --</option>';

        readers.forEach(reader => {
            select.innerHTML += `<option value="${reader.id}">${reader.firstName} ${reader.lastName}</option>`;
        });
    }

    function borrowBook() {
        const bookId = document.getElementById('borrowBookId').value;
        const readerId = document.getElementById('borrowReaderId').value;

        // Обновляем статус книги
        const book = books.find(b => b.id == bookId);
        if (book) {
            book.isBorrowed = true;

            fetch(`/api/books/${bookId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(book)
            })
            .then(() => {
                alert('Книга выдана!');
                document.getElementById('borrowForm').reset();
                loadBooks();
            });
        }
    }

    function returnBook() {
        const bookId = document.getElementById('returnBookId').value;

        const book = books.find(b => b.id == bookId);
        if (book) {
            book.isBorrowed = false;

            fetch(`/api/books/${bookId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(book)
            })
            .then(() => {
                alert('Книга возвращена!');
                document.getElementById('returnForm').reset();
                loadBooks();
            });
        }
    }
</script>
</body>
</html>
